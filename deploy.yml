name: Deploy website

on:
  push:
    branches: [main]      # run every time something is pushed to main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make sure index.html exists
        run: test -f index.html

  deploy:
    needs: check          # only run if the check passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            